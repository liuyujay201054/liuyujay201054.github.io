<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神明的挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #0b0b1a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dialog {
            background: linear-gradient(145deg, #101024, #1a1a38);
            border: 1px solid rgba(100, 150, 255, 0.25);
            box-shadow: 0 0 30px rgba(80, 130, 255, 0.15), inset 0 0 20px rgba(80, 130, 255, 0.05);
            padding: 40px 36px;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            transition: all 0.3s ease;
        }
        .dialog h3 {
            font-size: 21px;
            margin-bottom: 26px;
            line-height: 1.7;
            color: #e6edff;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 18px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(145deg, #253555, #1e2b48);
            color: #d6e0ff;
            min-width: 110px;
            transition: 0.25s ease;
            border: 1px solid rgba(120, 170, 255, 0.2);
            letter-spacing: 0.5px;
        }
        button:hover {
            background: linear-gradient(145deg, #2f4066, #253555);
            box-shadow: 0 0 15px rgba(100, 160, 255, 0.3);
            color: #fff;
        }

        .video-wrap {
            position: fixed;
            inset:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:800;
        }
        #mainVideo {
            width:100%;
            height:100%;
            object-fit: cover;
        }
        .input-wrap {
            margin:16px 0;
        }
        #answerInput {
            width:100%;
            padding:12px;
            font-size:16px;
            border-radius:8px;
            border:none;
            background:#222;
            color:#fff;
        }
        .countdown-text {
            color:#ff6666;
            margin-bottom:12px;
            font-size:17px;
        }
        .end-img-wrap {
            position:fixed;
            inset:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:1000;
        }
        #endImg {
            max-width:90%;
            max-height:90vh;
        }
        .checkbox-item {
            margin:12px 0;
            font-size:16px;
            color:#d6e0ff;
        }
    </style>
</head>
<body>
    <div class="video-wrap" id="videoWrap" style="display:none;">
        <video id="mainVideo" preload="auto"></video>
    </div>

    <div class="mask" id="welcomeMask">
        <div class="dialog">
            <h3>欢迎来到神的领域，接受挑战可继续，不接受可直接退出。挑战完所有任务，将得到神秘奖励</h3>
            <div class="btn-group">
                <button id="btnWelcomeContinue">继续</button>
                <button id="btnWelcomeExit">退出</button>
            </div>
        </div>
    </div>

    <div class="mask" id="mask1" style="display:none;">
        <div class="dialog">
            <h3>请问欣赏这个男孩吗？</h3>
            <div class="btn-group">
                <button id="btn1Yes">欣赏</button>
                <button id="btn1No">不欣赏</button>
            </div>
        </div>
    </div>

    <div class="mask" id="mask2" style="display:none;">
        <div class="dialog">
            <h3>如果你睡得比较早选a，睡得不早，选b，有心事，睡不着，选c（读者看完之后选一个选项）</h3>
            <div class="btn-group">
                <button id="btn2A">A</button>
                <button id="btn2B">B</button>
                <button id="btn2C">C</button>
            </div>
        </div>
    </div>

    <div class="mask" id="mask3" style="display:none;">
        <div class="dialog">
            <h3>【多选】</h3>
            <div class="checkbox-item">
                <input type="checkbox" id="optA"> A：好听
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optB"> B：不好听
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optC"> C：觉得作者有品
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optD"> D：第一选项没有听过
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optE"> E：听过之后非常喜欢
            </div>
            <div class="btn-group">
                <button id="btn3Submit">提交</button>
            </div>
        </div>
    </div>

    <div class="mask" id="mask4" style="display:none;">
        <div class="dialog">
            <h3>喜欢上学，打一个喜欢的英文，不喜欢上学，打一个不喜欢上学的英文</h3>
            <div class="countdown-text" id="countdown">剩余时间：60秒</div>
            <div class="input-wrap">
                <input type="text" id="answerInput" placeholder="输入like / dislike">
            </div>
            <div class="btn-group">
                <button id="btn4Submit">提交答案</button>
            </div>
        </div>
    </div>

    <div class="end-img-wrap" id="endWrap" style="display:none;">
        < img id="endImg" src="end.jpg" alt="神秘奖励">
    </div>

<script>
const videoList = [
    "v1.mp4",
    "v2.mp4",
    "v3.mp4",
    "v4.mp4"
];
let currentVideoIndex = 0;
let countdownTimer = null;

const videoEl = document.getElementById('mainVideo');
const videoWrap = document.getElementById('videoWrap');

const welcomeMask = document.getElementById('welcomeMask');
const mask1 = document.getElementById('mask1');
const mask2 = document.getElementById('mask2');
const mask3 = document.getElementById('mask3');
const mask4 = document.getElementById('mask4');
const endWrap = document.getElementById('endWrap');

document.getElementById('btnWelcomeContinue').onclick = startPlay;
document.getElementById('btnWelcomeExit').onclick = startPlay;

function forceFullscreen(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
    }
}
setInterval(forceFullscreen, 500);
document.addEventListener('keydown',e=>{
    if(e.key==="Escape") e.preventDefault();
})

function startPlay(){
    welcomeMask.style.display = "none";
    videoWrap.style.display = "flex";
    playVideo(currentVideoIndex);
}

function playVideo(idx){
    if(idx >= videoList.length) return;
    videoEl.src = videoList[idx];
    videoEl.load();
    videoEl.muted = false;
    videoEl.controls = false;
    videoEl.play().then(forceFullscreen);

    videoEl.onended = ()=>{
        if(idx === 0) mask1.style.display = "flex";
        if(idx === 1) mask2.style.display = "flex";
        if(idx === 2) mask3.style.display = "flex";
        if(idx === 3) {startCountdown(); mask4.style.display = "flex";}
    }
}

// 失败也显示 end.jpg
function failGame(){
    mask1.style.display="none";mask2.style.display="none";mask3.style.display="none";mask4.style.display="none";
    videoWrap.style.display="none";
    endWrap.style.display="flex";
    setTimeout(()=>{window.close()},2500);
}

document.getElementById('btn1Yes').onclick = ()=>{
    mask1.style.display = "none";
    currentVideoIndex = 1;
    playVideo(currentVideoIndex);
}
document.getElementById('btn1No').onclick = failGame;

document.getElementById('btn2A').onclick = ()=>{
    mask2.style.display = "none";
    currentVideoIndex = 2;
    playVideo(currentVideoIndex);
}
document.getElementById('btn2B').onclick = ()=>{
    mask2.style.display = "none";
    currentVideoIndex = 2;
    playVideo(currentVideoIndex);
}
document.getElementById('btn2C').onclick = failGame;

document.getElementById('btn3Submit').onclick = ()=>{
    const bChecked = document.getElementById('optB').checked;
    const dChecked = document.getElementById('optD').checked;
    if(bChecked || dChecked){
        failGame();
    }else{
        mask3.style.display = "none";
        currentVideoIndex = 3;
        playVideo(currentVideoIndex);
    }
}

function startCountdown(){
    let left = 60;
    const dom = document.getElementById('countdown');
    countdownTimer = setInterval(()=>{
        left--;
        dom.innerText = `剩余时间：${left}秒`;
        if(left <=0){
            clearInterval(countdownTimer);
            failGame();
        }
    },1000);
}

document.getElementById('btn4Submit').onclick = ()=>{
    clearInterval(countdownTimer);
    const val = document.getElementById('answerInput').value.trim().toLowerCase();
    if(val === "like" || val === "dislike"){
        mask4.style.display = "none";
        videoWrap.style.display = "none";
        endWrap.style.display = "flex";
        setTimeout(()=>{window.close()},3000);
    }else{
        alert("输入错误，请输入 like 或者 dislike");
    }
}
</script>
</body>
</html>
