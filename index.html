<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神明的挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#05060d;color:#fff;overflow:hidden}
.p{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
.p.a{display:flex}
#s{background:radial-gradient(circle at 20% 30%,rgba(56,89,165,.35),transparent 45%),radial-gradient(circle at 80% 70%,rgba(101,123,255,.25),transparent 50%),linear-gradient(160deg,#070812,#0b0f1f 50%,#070812);flex-direction:column;z-index:1000}
.t{font-size:clamp(32px,6vw,56px);letter-spacing:12px;color:#eaf1ff;text-shadow:0 0 24px rgba(120,170,255,.45);margin-bottom:14px}
.st{font-size:clamp(14px,1.6vw,18px);letter-spacing:4px;color:#8ea4d2;margin-bottom:50px}
button{padding:13px 14px;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(145deg,#253555,#1e2b48);color:#d6e0ff;transition:.25s;border:1px solid rgba(120,170,255,.2)}
button:hover{background:linear-gradient(145deg,#2f4066,#253555);box-shadow:0 0 15px rgba(100,160,255,.3);color:#fff}
#sb{padding:16px 52px;font-size:18px;letter-spacing:8px;color:#eaf1ff;background:transparent;border:1px solid rgba(120,170,255,.45);border-radius:2px}
#sb:hover{background:rgba(120,170,255,.12);letter-spacing:10px}
#v{background:#000;z-index:800}
#v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s;background:#000}
#v video.a{opacity:1}
@media(max-width:767px){#v video{object-fit:contain}}
.m{position:fixed;inset:0;background:rgba(5,6,13,.85);z-index:999;display:none;align-items:center;justify-content:center}
.m.a{display:flex}
.d{background:linear-gradient(145deg,rgba(16,20,42,.96),rgba(28,34,64,.96));border:1px solid rgba(120,170,255,.35);box-shadow:0 0 40px rgba(80,130,255,.18);padding:44px 36px;border-radius:18px;width:92%;max-width:560px}
.d h3{font-size:19px;line-height:1.8;color:#e6edff;font-weight:500;margin-bottom:26px}
.bg{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.bg button{flex:1;min-width:90px}
#c{color:#ff8080;margin-bottom:14px;font-size:17px}
#ai{width:100%;padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid rgba(120,170,255,.25);background:rgba(255,255,255,.04);color:#fff;outline:none}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:16px;color:#d6e0ff;cursor:pointer}
#e{background:#000;flex-direction:column;gap:22px;z-index:1000;padding:24px}
#ei{max-width:92%;max-height:68vh;border-radius:12px;cursor:pointer}
#et{font-size:15px;letter-spacing:6px;color:#8ea4d2}
#e[data-t=fail] #et{color:#ff8080}
#e[data-t=success] #et{color:#8fffc4}
#rt{padding:12px 46px}
</style>
</head>
<body>
<div class="p a" id="s"><div style="text-align:center"><div class="t">神明的挑战</div><div class="st">DIVINE CHALLENGE</div><button id="sb">开 始 挑 战</button></div></div>
<div class="p" id="v"><video id="A" preload="auto" playsinline webkit-playsinline></video><video id="B" preload="auto" playsinline webkit-playsinline></video></div>
<div class="m" id="m1"><div class="d"><h3>请问欣赏这个男孩吗？</h3><div class="bg"><button id="y1">欣赏</button><button id="n1">不欣赏</button></div></div></div>
<div class="m" id="m2"><div class="d"><h3>如果你睡得比较早选a，睡得不早，选b，有心事，睡不着，选c。</h3><div class="bg"><button id="a2">A</button><button id="b2">B</button><button id="c2">C</button></div></div></div>
<div class="m" id="m3"><div class="d"><h3>【多选】请选择你对这段音乐的感受。</h3><label class="ck"><input type="checkbox" id="oA">A：好听</label><label class="ck"><input type="checkbox" id="oB">B：不好听</label><label class="ck"><input type="checkbox" id="oC">C：觉得作者有品</label><label class="ck"><input type="checkbox" id="oD">D：第一选项没有听过</label><label class="ck"><input type="checkbox" id="oE">E：听过之后非常喜欢</label><div class="bg"><button id="s3">提交</button></div></div></div>
<div class="m" id="m4"><div class="d"><h3>喜欢上学，输入一个表示喜欢的英文；不喜欢上学，输入一个表示不喜欢上学的英文。</h3><div id="c">剩余时间：60秒</div><input id="ai" placeholder="请输入你的答案" autocomplete="off"><div class="bg"><button id="s4">提交答案</button></div></div></div>
<div class="p" id="e">< img id="ei" alt="结局"><div id="et"></div><button id="rt">重 新 挑 战</button></div>
<script>
const $=id=>document.getElementById(id),V=["v1.mp4","v2.mp4","v3.mp4","v4.mp4"],EI={success:"end.jpg",fail:"end.jpg"},N=60;
const P=[$('A'),$('B')],VW=$('v'),SP=$('s'),M1=$('m1'),M2=$('m2'),M3=$('m3'),M4=$('m4'),EW=$('e'),EI2=$('ei'),ET=$('et'),AI=$('ai'),CD=$('c');
let k=0,CE=null,CI=-1,TM=null;
const HM=()=>[M1,M2,M3,M4].forEach(m=>m.classList.remove('a'));
function PL(i){if(i<0||i>=V.length)return;CI=i;const c=P[k],n=P[1-k],s=V[i];if(c.dataset.s!==s){c.dataset.s=s;c.src=s;c.load()}c.classList.add('a');n.classList.remove('a');CE=c;const ns=V[i+1];if(ns){if(n.dataset.s!==ns){n.dataset.s=ns;n.src=ns;n.load()}}else{n.removeAttribute('src');n.dataset.s='';n.load()}k=1-k;c.play().catch(()=>{c.muted=true;c.play().catch(()=>{})})}
P.forEach(v=>{v.onended=()=>{if(v!==CE)return;if(CI===0)M1.classList.add('a');else if(CI===1)M2.classList.add('a');else if(CI===2)M3.classList.add('a');else if(CI===3){SC();M4.classList.add('a');setTimeout(()=>AI.focus(),200)}};v.onerror=()=>{if(v!==CE)return;alert('视频加载失败：'+V[CI])}});
function SC(){clearInterval(TM);let l=N;CD.innerText=`剩余时间：${l}秒`;TM=setInterval(()=>{l--;CD.innerText=`剩余时间：${l}秒`;if(l<=0){clearInterval(TM);RS('fail','时间到')}},1000)}
function RS(t,x){clearInterval(TM);HM();if(CE)CE.pause();if(CE)CE.classList.remove('a');VW.classList.remove('a');EW.dataset.t=t;EI2.src=EI[t]||EI.fail;ET.innerText=x||(t==='success'?'挑战成功':'挑战失败');EW.classList.add('a')}
function RE(){clearInterval(TM);HM();P.forEach(v=>{v.pause();v.classList.remove('a')});P[1].removeAttribute('src');P[1].dataset.s='';P[1].load();P[0].dataset.s=V[0];P[0].src=V[0];P[0].load();k=0;CE=null;CI=-1;VW.classList.remove('a');EW.classList.remove('a');EW.removeAttribute('data-t');EI2.removeAttribute('src');ET.innerText='';AI.value='';CD.innerText=`剩余时间：${N}秒`;document.querySelectorAll('.m input[type=checkbox]').forEach(c=>c.checked=false);SP.classList.add('a')}
$('sb').onclick=()=>{SP.classList.remove('a');VW.classList.add('a');if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});PL(0)};
$('rt').onclick=RE;EI2.onclick=RE;
$('y1').onclick=()=>{M1.classList.remove('a');PL(1)};$('n1').onclick=()=>RS('fail','挑战失败');
$('a2').onclick=()=>{M2.classList.remove('a');PL(2)};$('b2').onclick=()=>{M2.classList.remove('a');PL(2)};$('c2').onclick=()=>RS('fail','挑战失败');
$('s3').onclick=()=>{const b=['oA','oB','oC','oD','oE'].map(i=>$(i));if(!b.some(x=>x.checked)){alert('请至少选择一项。');return}if($('oB').checked||$('oD').checked)RS('fail','挑战失败');else{M3.classList.remove('a');PL(3)}};
$('s4').onclick=()=>{const v=AI.value.trim().toLowerCase();if(v==='like'||v==='dislike')RS('success','挑战成功');else RS('fail','答案错误')};
AI.addEventListener('keydown',e=>{if(e.key==='Enter')$('s4').click()});
P[0].dataset.s=V[0];P[0].src=V[0];P[0].load();
</script>
</body>
</html>
