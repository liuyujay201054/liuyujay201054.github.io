<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神明的5个考验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b1a;
            color: #f0f0f0;
            padding: 32px 16px;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            line-height: 1.7;
            background-image: radial-gradient(circle at 50% 40%, #1a1a38 0%, #0b0b1a 70%);
            min-height: 100vh;
        }
        .welcome-tip {
            max-width: 1400px;
            margin: 0 auto 40px;
            text-align: center;
            font-size: 22px;
            opacity: 0.85;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }
        .card {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: transform 0.25s ease;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card.hidden {
            display: none;
        }
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            background: #16162c;
            padding: 36px;
            border-radius: 16px;
            max-width: 520px;
            width: 90%;
            color: #fff;
        }
        .modal-close {
            margin-top: 24px;
            padding: 10px 24px;
            background: #4455bb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .start-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .start-box {
            background: #121228;
            padding: 40px;
            border-radius: 18px;
            max-width: 500px;
            width: 90%;
            color: #fff;
            text-align: center;
        }
        .start-btn {
            margin-top: 28px;
            padding: 12px 28px;
            background: #5066dd;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
        }
        .video-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }
        .video-player {
            width: 90%;
            max-width: 700px;
        }
        .skip-video-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="start-mask" id="startMask">
        <div class="start-box">
            <h2>✨欢迎来到神明的考验✨</h2>
            <p style="margin-top:16px; font-size:16px;">
                你即将开启一场特别的试炼。<br>
                必须完成上一关，才能解锁下一关。<br>
                准备好了吗？
            </p>
            <button class="start-btn" id="startBtn">我准备好了，开始试炼</button>
        </div>
    </div>

    <div class="welcome-tip">神明的5个考验，点击卡片开启</div>
    <div class="container">
        <div class="card hidden" data-index="0">
            <img src="cover_life.jpg" alt="生活">
        </div>
        <div class="card hidden" data-index="1">
            <img src="cover_food.jpg" alt="美食">
        </div>
        <div class="card hidden" data-index="2">
            <img src="cover_game.jpg" alt="游戏">
        </div>
        <div class="card hidden" data-index="3">
            <img src="cover_music..jpg" alt="音乐">
        </div>
        <div class="card hidden" data-index="4">
            <img src="cover_funny.jpg" alt="趣味">
        </div>
    </div>

    <div class="modal-mask" id="mask">
        <div class="modal-box">
            <div id="modal-text"></div>
            <button class="modal-close" id="closeBtn">看完，解锁下一个</button>
        </div>
    </div>

    <div class="video-mask" id="videoMask">
        <button class="skip-video-btn" id="skipVideoBtn">跳过视频</button>
        <video class="video-player" id="prankVideo" controls>
            <source src="prank.mp4" type="video/mp4">
        </video>
    </div>

<script>
const texts = [
    "生活的考验：相信我，虽然图片很美，但你还需要继续发掘更多",
    "美食的考验：这很好吃，我知道，但现实你吃不到。为什么视频内容一样？？？",
    "游戏的考验：如果你打游戏很厉害，恭喜你有资格和作者玩了。其实这位是一个网页bug，但我保证后面不会有",
    "音乐的考验：这首歌蛮好听，觉得不好听直接找个楼跳了，其实这是个恶搞网站，但惊喜就在眼前",
    "趣味的考验：乐子"
];

const cards = document.querySelectorAll(".card");
const mask = document.getElementById("mask");
const modalText = document.getElementById("modal-text");
const closeBtn = document.getElementById("closeBtn");
const startMask = document.getElementById("startMask");
const startBtn = document.getElementById("startBtn");
const videoMask = document.getElementById("videoMask");
const prankVideo = document.getElementById("prankVideo");
const skipVideoBtn = document.getElementById("skipVideoBtn");

let current = 0;

startBtn.addEventListener("click", () => {
    startMask.style.display = "none";
    // 显示第一关
    cards[current].classList.remove("hidden");
});

// 点击卡片
cards.forEach((card) => {
    card.addEventListener("click", () => {
        const idx = Number(card.dataset.index);
        if (idx !== current) return;
        modalText.innerText = texts[idx];
        // 弹出视频
        videoMask.style.display = "flex";
    });
});

// 视频播放结束自动打开文字弹窗
prankVideo.addEventListener("ended", () => {
    closeVideoAndShowText();
});

// 跳过视频
skipVideoBtn.addEventListener("click", () => {
    closeVideoAndShowText();
});

function closeVideoAndShowText() {
    videoMask.style.display = "none";
    prankVideo.pause();
    prankVideo.currentTime = 0;
    mask.style.display = "flex";
}

// 点击解锁下一关
closeBtn.addEventListener("click", () => {
    mask.style.display = "none";
    // 把当前这一关隐藏（消失）
    cards[current].classList.add("hidden");
    current++;
    if (current < cards.length) {
        // 显示新的一关
        cards[current].classList.remove("hidden");
    }
});
</script>
</body>
</html>
