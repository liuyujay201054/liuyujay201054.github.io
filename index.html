<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神明的挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #05060d;
            color: #fff;
            overflow: hidden;
        }
        /* 全屏首页封面 */
        .start-page {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 20% 30%, rgba(56, 89, 165, 0.35), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(101, 123, 255, 0.25), transparent 50%),
                linear-gradient(160deg, #070812 0%, #0b0f1f 50%, #070812 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .start-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.5), transparent 60%),
                radial-gradient(1px 1px at 35% 75%, rgba(180,210,255,0.35), transparent 60%),
                radial-gradient(1.5px 1.5px at 65% 35%, rgba(255,255,255,0.45), transparent 60%),
                radial-gradient(1px 1px at 85% 65%, rgba(150,180,255,0.3), transparent 60%),
                radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.25), transparent 60%);
            pointer-events: none;
        }
        .cover-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 24px;
        }
        .cover-title {
            font-size: clamp(32px, 6vw, 56px);
            letter-spacing: 12px;
            color: #eaf1ff;
            text-shadow: 0 0 24px rgba(120, 170, 255, 0.45);
            margin-bottom: 14px;
        }
        .cover-subtitle {
            font-size: clamp(14px, 1.6vw, 18px);
            letter-spacing: 4px;
            color: #8ea4d2;
            margin-bottom: 50px;
        }
        #startBtn {
            padding: 16px 52px;
            font-size: 18px;
            letter-spacing: 8px;
            color: #eaf1ff;
            background: transparent;
            border: 1px solid rgba(120, 170, 255, 0.45);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        #startBtn:hover {
            background: rgba(120, 170, 255, 0.12);
            border-color: rgba(180, 210, 255, 0.8);
            box-shadow: 0 0 28px rgba(120, 170, 255, 0.35);
            letter-spacing: 10px;
        }
        .tip-text {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #5a6a94;
            letter-spacing: 2px;
            z-index: 2;
        }
        /* 弹窗遮罩 */
        .mask {
            position: fixed;
            inset: 0;
            background: rgba(5, 6, 13, 0.78);
            backdrop-filter: blur(14px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .mask.active {
            display: flex;
        }
        .dialog {
            background: linear-gradient(145deg, rgba(16, 20, 42, 0.96), rgba(28, 34, 64, 0.96));
            border: 1px solid rgba(120, 170, 255, 0.35);
            box-shadow: 0 0 40px rgba(80, 130, 255, 0.18), inset 0 0 24px rgba(80, 130, 255, 0.08);
            padding: 44px 36px;
            border-radius: 18px;
            width: 92%;
            max-width: 560px;
        }
        .dialog h3 {
            font-size: 19px;
            line-height: 1.8;
            color: #e6edff;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 26px;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 13px 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(145deg, #253555, #1e2b48);
            color: #d6e0ff;
            min-width: 90px;
            transition: 0.25s ease;
            border: 1px solid rgba(120, 170, 255, 0.2);
            letter-spacing: 0.5px;
        }
        button:hover {
            background: linear-gradient(145deg, #2f4066, #253555);
            box-shadow: 0 0 15px rgba(100, 160, 255, 0.3);
            color: #fff;
        }
        /* 视频容器 */
        .video-wrap {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 800;
        }
        .video-wrap.active {
            display: flex;
        }
        #mainVideo {
            width: 100%;
            height: 100%;
        }
        @media (min-width: 768px) {
            #mainVideo {
                object-fit: cover;
            }
        }
        @media (max-width: 767px) {
            #mainVideo {
                object-fit: contain;
                background: #000;
            }
        }
        .input-wrap {
            margin: 18px 0;
        }
        #answerInput {
            width: 100%;
            padding: 13px 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid rgba(120, 170, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
        }
        #answerInput:focus {
            border-color: rgba(120, 170, 255, 0.7);
            box-shadow: 0 0 14px rgba(100, 160, 255, 0.25);
        }
        .countdown-text {
            color: #ff8080;
            margin-bottom: 14px;
            font-size: 17px;
            letter-spacing: 1px;
        }
        /* 结局层（成功/失败共用同一张图） */
        .end-img-wrap {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .end-img-wrap.active {
            display: flex;
        }
        #endImg {
            max-width: 92%;
            max-height: 80vh;
        }
        #backHomeBtn {
            margin-top:24px;
            padding:12px 32px;
        }
        .checkbox-item {
            margin: 14px 0;
            font-size: 16px;
            color: #d6e0ff;
        }
    </style>
</head>
<body>
<!-- 首页封面 -->
<div class="start-page" id="startPage">
    <div class="cover-content">
        <div class="cover-title">神明的挑战</div>
        <div class="cover-subtitle">DIVINE CHALLENGE</div>
        <button id="startBtn">开 始 挑 战</button>
    </div>
    <div class="tip-text">接受命运的指引，完成所有任务</div>
</div>

<!-- 视频层 -->
<div class="video-wrap" id="videoWrap">
    <video id="mainVideo" preload="metadata"></video>
</div>

<!-- 第一题 -->
<div class="mask" id="mask1">
    <div class="dialog">
        <h3>请问欣赏这个男孩吗？</h3>
        <div class="btn-group">
            <button id="btn1Yes">欣赏</button>
            <button id="btn1No">不欣赏</button>
        </div>
    </div>
</div>

<!-- 第二题 -->
<div class="mask" id="mask2">
    <div class="dialog">
        <h3>如果你睡得比较早选a，睡得不早，选b，有心事，睡不着，选c。</h3>
        <div class="btn-group">
            <button id="btn2A">A</button>
            <button id="btn2B">B</button>
            <button id="btn2C">C</button>
        </div>
    </div>
</div>

<!-- 第三题 -->
<div class="mask" id="mask3">
    <div class="dialog">
        <h3>【多选】请选择你对这段音乐的感受。</h3>
        <div class="checkbox-item">
            <input type="checkbox" id="optA"> A：好听
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="optB"> B：不好听
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="optC"> C：觉得作者有品
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="optD"> D：第一选项没有听过
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="optE"> E：听过之后非常喜欢
        </div>
        <div class="btn-group">
            <button id="btn3Submit">提交</button>
        </div>
    </div>
</div>

<!-- 第四题 -->
<div class="mask" id="mask4">
    <div class="dialog">
        <h3>喜欢上学，输入一个表示喜欢的英文；不喜欢上学，输入一个表示不喜欢上学的英文。</h3>
        <div class="countdown-text" id="countdown">剩余时间：60秒</div>
        <div class="input-wrap">
            <input type="text" id="answerInput" placeholder="请输入你的答案">
        </div>
        <div class="btn-group">
            <button id="btn4Submit">提交答案</button>
        </div>
    </div>
</div>

<!-- 结局图（成功、失败共用） -->
<div class="end-img-wrap" id="endWrap">
    < img id="endImg" src="end.jpg" alt="画面">
    <button id="backHomeBtn">返回首页</button>
</div>

<script>
    const videoList = [
        "v1.mp4",
        "v2.mp4",
        "v3.mp4",
        "v4.mp4"
    ];
    let currentVideoIndex = 0;
    let countdownTimer = null;

    const videoEl = document.getElementById('mainVideo');
    const videoWrap = document.getElementById('videoWrap');
    const startPage = document.getElementById('startPage');
    const mask1 = document.getElementById('mask1');
    const mask2 = document.getElementById('mask2');
    const mask3 = document.getElementById('mask3');
    const mask4 = document.getElementById('mask4');
    const endWrap = document.getElementById('endWrap');
    const answerInput = document.getElementById('answerInput');

    // 回到首页
    function resetAll() {
        clearInterval(countdownTimer);
        currentVideoIndex = 0;
        answerInput.value = "";
        mask1.classList.remove("active");
        mask2.classList.remove("active");
        mask3.classList.remove("active");
        mask4.classList.remove("active");
        videoEl.pause();
        videoEl.src = "";
        videoEl.load();
        videoWrap.classList.remove("active");
        endWrap.classList.remove("active");
        startPage.style.display = "flex";
    }

    // 失败：直接显示图片
    function showFailImage() {
        clearInterval(countdownTimer);
        mask1.classList.remove("active");
        mask2.classList.remove("active");
        mask3.classList.remove("active");
        mask4.classList.remove("active");
        videoEl.pause();
        videoEl.src = "";
        videoWrap.classList.remove("active");
        endWrap.classList.add("active");
    }

    // 通关成功：显示图片
    function showEndImage() {
        clearInterval(countdownTimer);
        mask4.classList.remove("active");
        videoEl.pause();
        videoEl.src = "";
        videoWrap.classList.remove("active");
        endWrap.classList.add("active");
    }

    document.getElementById('startBtn').onclick = function () {
        startPage.style.display = "none";
        videoWrap.classList.add("active");
        forceFullscreen();
        playVideo(currentVideoIndex);
    };

    document.getElementById('backHomeBtn').onclick = resetAll;

    function forceFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === "Escape") e.preventDefault();
    });

    function playVideo(idx) {
        if (idx >= videoList.length) return;
        videoEl.pause();
        videoEl.currentTime = 0;
        videoEl.src = videoList[idx];
        videoEl.load();
        videoEl.muted = false;
        videoEl.controls = false;
        videoEl.play();

        videoEl.onended = () => {
            if (idx === 0) mask1.classList.add("active");
            if (idx === 1) mask2.classList.add("active");
            if (idx === 2) mask3.classList.add("active");
            if (idx === 3) {
                startCountdown();
                mask4.classList.add("active");
            }
        };
    }

    //第一题
    document.getElementById('btn1Yes').onclick = () => {
        mask1.classList.remove("active");
        currentVideoIndex = 1;
        playVideo(currentVideoIndex);
    };
    document.getElementById('btn1No').onclick = showFailImage;

    //第二题
    document.getElementById('btn2A').onclick = () => {
        mask2.classList.remove("active");
        currentVideoIndex = 2;
        playVideo(currentVideoIndex);
    };
    document.getElementById('btn2B').onclick = () => {
        mask2.classList.remove("active");
        currentVideoIndex = 2;
        playVideo(currentVideoIndex);
    };
    document.getElementById('btn2C').onclick = showFailImage;

    //第三题
    document.getElementById('btn3Submit').onclick = () => {
        const bChecked = document.getElementById('optB').checked;
        const dChecked = document.getElementById('optD').checked;
        if (bChecked || dChecked) {
            showFailImage();
        } else {
            mask3.classList.remove("active");
            currentVideoIndex = 3;
            playVideo(currentVideoIndex);
        }
    };

    //倒计时
    function startCountdown() {
        let left = 60;
        const dom = document.getElementById('countdown');
        countdownTimer = setInterval(() => {
            left--;
            dom.innerText = `剩余时间：${left}秒`;
            if (left <= 0) {
                clearInterval(countdownTimer);
                showFailImage();
            }
        }, 1000);
    }

    //第四题提交
    document.getElementById('btn4Submit').onclick = () => {
        clearInterval(countdownTimer);
        const val = answerInput.value.trim().toLowerCase();
        if (val === "like" || val === "dislike") {
            showEndImage();
        } else {
            alert("答案错误，挑战失败。");
            showFailImage();
        }
    };
</script>
</body>
</html>
