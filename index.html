<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神明的挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #0b0b1a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }
        .mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dialog {
            background: #16162c;
            padding: 36px 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 520px;
        }
        .dialog h3 {
            font-size: 20px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #2c3e50;
            color: #fff;
            min-width: 100px;
        }
        button:hover {
            background:#34495e;
        }
        .video-wrap {
            position: fixed;
            inset:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:800;
        }
        #mainVideo {
            width:90%;
            max-width:900px;
        }
        .input-wrap {
            margin:16px 0;
        }
        #answerInput {
            width:100%;
            padding:12px;
            font-size:16px;
            border-radius:8px;
            border:none;
            background:#222;
            color:#fff;
        }
        .countdown-text {
            color:#ff6666;
            margin-bottom:12px;
        }
        .end-img-wrap {
            position:fixed;
            inset:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:1000;
        }
        #endImg {
            max-width:90%;
            max-height:90vh;
        }
        .checkbox-item {
            margin:10px 0;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="video-wrap" id="videoWrap" style="display:none;">
        <video id="mainVideo" controls="false" preload="auto"></video>
    </div>

    <!-- 欢迎弹窗 -->
    <div class="mask" id="welcomeMask">
        <div class="dialog">
            <h3>欢迎来到神的领域，接受挑战可继续，不接受可直接退出。挑战完所有任务，将得到神秘奖励</h3>
            <div class="btn-group">
                <button id="btnWelcomeContinue">继续</button>
                <button id="btnWelcomeExit">退出</button>
            </div>
        </div>
    </div>

    <!-- 弹窗1：请问欣赏这个男孩吗 -->
    <div class="mask" id="mask1" style="display:none;">
        <div class="dialog">
            <h3>请问欣赏这个男孩吗？</h3>
            <div class="btn-group">
                <button id="btn1Yes">欣赏</button>
                <button id="btn1No">不欣赏</button>
            </div>
        </div>
    </div>

    <!-- 弹窗2：睡眠选择 A B C -->
    <div class="mask" id="mask2" style="display:none;">
        <div class="dialog">
            <h3>如果你睡得比较早选a，睡得不早，选b，有心事，睡不着，选c（读者看完之后选一个选项）</h3>
            <div class="btn-group">
                <button id="btn2A">A</button>
                <button id="btn2B">B</button>
                <button id="btn2C">C</button>
            </div>
        </div>
    </div>

    <!-- 弹窗3：多选歌曲评价 -->
    <div class="mask" id="mask3" style="display:none;">
        <div class="dialog">
            <h3>【多选】</h3>
            <div class="checkbox-item">
                <input type="checkbox" id="optA"> A：好听
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optB"> B：不好听
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optC"> C：觉得作者有品
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optD"> D：第一选项没有听过
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optE"> E：听过之后非常喜欢
            </div>
            <div class="btn-group">
                <button id="btn3Submit">提交</button>
            </div>
        </div>
    </div>

    <!-- 弹窗4：英文输入答题 -->
    <div class="mask" id="mask4" style="display:none;">
        <div class="dialog">
            <h3>喜欢上学，打一个喜欢的英文，不喜欢上学，打一个不喜欢上学的英文</h3>
            <div class="countdown-text" id="countdown">剩余时间：60秒</div>
            <div class="input-wrap">
                <input type="text" id="answerInput" placeholder="输入like / dislike">
            </div>
            <div class="btn-group">
                <button id="btn4Submit">提交答案</button>
            </div>
        </div>
    </div>

    <!-- 结束奖励图片 -->
    <div class="end-img-wrap" id="endWrap" style="display:none;">
        < img id="endImg" src="end.jpg" alt="神秘奖励">
    </div>

<script>
const videoList = [
    "v1.mp4",
    "v2.mp4",
    "v3.mp4",
    "v4.mp4"
];
let currentVideoIndex = 0;
let countdownTimer = null;

const videoEl = document.getElementById('mainVideo');
const videoWrap = document.getElementById('videoWrap');

// 弹窗元素
const welcomeMask = document.getElementById('welcomeMask');
const mask1 = document.getElementById('mask1');
const mask2 = document.getElementById('mask2');
const mask3 = document.getElementById('mask3');
const mask4 = document.getElementById('mask4');
const endWrap = document.getElementById('endWrap');

// 欢迎按钮
document.getElementById('btnWelcomeContinue').onclick = startPlay;
document.getElementById('btnWelcomeExit').onclick = startPlay;

// 播放视频函数
function startPlay(){
    welcomeMask.style.display = "none";
    videoWrap.style.display = "flex";
    playVideo(currentVideoIndex);
}

function playVideo(idx){
    if(idx >= videoList.length) return;
    videoEl.src = videoList[idx];
    videoEl.load();
    videoEl.muted = false;
    videoEl.controls = false;
    videoEl.play().then(()=>{
        // 请求全屏
        videoEl.requestFullscreen().catch(()=>{});
    });

    videoEl.onended = ()=>{
        // 视频播完，弹出对应弹窗
        if(idx === 0){
            mask1.style.display = "flex";
        }else if(idx === 1){
            mask2.style.display = "flex";
        }else if(idx === 2){
            mask3.style.display = "flex";
        }else if(idx === 3){
            startCountdown();
            mask4.style.display = "flex";
        }
    }
}

// 弹窗1逻辑
document.getElementById('btn1Yes').onclick = ()=>{
    mask1.style.display = "none";
    currentVideoIndex = 1;
    playVideo(currentVideoIndex);
}
document.getElementById('btn1No').onclick = ()=>{
    window.close();
}

// 弹窗2逻辑
document.getElementById('btn2A').onclick = ()=>{
    mask2.style.display = "none";
    currentVideoIndex = 2;
    playVideo(currentVideoIndex);
}
document.getElementById('btn2B').onclick = ()=>{
    mask2.style.display = "none";
    currentVideoIndex = 2;
    playVideo(currentVideoIndex);
}
document.getElementById('btn2C').onclick = ()=>{
    window.close();
}

// 弹窗3多选逻辑
document.getElementById('btn3Submit').onclick = ()=>{
    const bChecked = document.getElementById('optB').checked;
    const dChecked = document.getElementById('optD').checked;
    if(bChecked || dChecked){
        window.close();
    }else{
        mask3.style.display = "none";
        currentVideoIndex = 3;
        playVideo(currentVideoIndex);
    }
}

// 弹窗4倒计时
function startCountdown(){
    let left = 60;
    const dom = document.getElementById('countdown');
    countdownTimer = setInterval(()=>{
        left--;
        dom.innerText = `剩余时间：${left}秒`;
        if(left <=0){
            clearInterval(countdownTimer);
            window.close();
        }
    },1000);
}

document.getElementById('btn4Submit').onclick = ()=>{
    clearInterval(countdownTimer);
    const val = document.getElementById('answerInput').value.trim().toLowerCase();
    if(val === "like" || val === "dislike"){
        mask4.style.display = "none";
        videoWrap.style.display = "none";
        endWrap.style.display = "flex";
        // 展示图片3秒后关闭网页
        setTimeout(()=>{
            window.close();
        },3000);
    }else{
        alert("输入错误，请输入 like 或者 dislike");
    }
}

// 拦截esc退出全屏（浏览器限制不能100%拦截）
document.addEventListener('keydown',(e)=>{
    if(e.key === "Escape"){
        e.preventDefault();
        videoEl.requestFullscreen().catch(()=>{});
    }
})
</script>
</body>
</html>
