<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搞笑视频站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: system-ui, sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
        }
        .card {
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .card .title {
            padding:10px;
            background:rgba(0,0,0,0.7);
            text-align:center;
        }
        video {
            width:100%;
            max-width:800px;
            margin:30px auto;
            display:block;
            border-radius:8px;
        }
        .footer {
            margin-top:40px;
            text-align:center;
            color:#aaa;
            font-size:14px;
        }
    </style>
</head>
<body>
    <h1>搞笑视频站</h1>

    <div class="grid">
        <div class="card" onclick="playVideo('cover_life.jpg')">
            < img src="cover_life.jpg" alt="生活">
            <div class="title">生活</div>
        </div>
        <div class="card" onclick="playVideo('cover_food.jpg')">
            < img src="cover_food.jpg" alt="美食">
            <div class="title">美食</div>
        </div>
        <div class="card" onclick="playVideo('cover_game.jpg')">
            < img src="cover_game.jpg" alt="游戏">
            <div class="title">游戏</div>
        </div>
        <div class="card" onclick="playVideo('cover_music.jpg')">
            < img src="cover_music.jpg" alt="音乐">
            <div class="title">音乐</div>
        </div>
        <div class="card" onclick="playVideo('cover_funny.jpg')">
            < img src="cover_funny.jpg" alt="搞笑杂谈">
            <div class="title">搞笑杂谈</div>
        </div>
    </div>

    <video id="myVideo" controls poster="">
        <source src="prank.mp4" type="video/mp4">
    </video>

    <div class="footer">
        本页面仅供娱乐，素材来源于网络。
    </div>

    <script>
        const video = document.getElementById('myVideo');
        function playVideo(posterSrc){
            video.poster = posterSrc;
            video.currentTime = 0;
            video.play();
        }
    </script>
</body>
</html>
